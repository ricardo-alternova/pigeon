# Fictional sample rules. Key reference: docs/setup.md#rules
# Exact sender, subject regex, account scope, trash and exclusions.
[[rules]]
id = "digest"
accounts = ["cedar", "marble"]
sender = "digest@example.net"
subject = "Weekly"
action = "trash"
exclusions = ["invoice", "question"]

# Domain and attachment predicates; archive action.
[[rules]]
id = "receipts"
accounts = ["cedar"]
domain = "example.org"
has_attachment = true
action = "archive"

